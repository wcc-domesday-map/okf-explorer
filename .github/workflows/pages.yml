name: Warwickshire standalone Pages guard

# This localized Explorer is only a served application fragment. The private
# parent repository assembles it at /knowledge/ beside the reviewed public
# bundle at /okf/warwickshire-public/. Publishing this repository on its own
# would omit that sibling bundle and could create an unintended public surface.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-pages-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse standalone publication
        run: |
          echo "::error::Standalone GitHub Pages publication is disabled for the Warwickshire profile. Build and deploy it only through the restricted parent repository, which assembles /knowledge/ and /okf/warwickshire-public/."
          exit 1
